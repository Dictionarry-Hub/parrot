version: '3.8'

services:
  parrot:
    build: .
    container_name: parrot-bot
    restart: unless-stopped
    ports:
      - "6007:6007"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=6007
      - API_RELOAD=false
      - DEBUG=false