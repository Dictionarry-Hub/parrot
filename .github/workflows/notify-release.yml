name: Notify Release

on:
  workflow_call:
    secrets:
      PARROT_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get release information
        id: release
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const release = context.payload.release;

            if (!release) {
              core.setFailed('No release information found in the event payload');
              return;
            }

            // Format the release data
            const releaseData = {
              repository: `${owner}/${repo}`,
              version: release.tag_name.replace(/^v/, ''), // Remove 'v' prefix if present
              tag_name: release.tag_name,
              name: release.name,
              body: release.body,
              url: release.html_url,
              created_at: release.created_at,
              prerelease: release.prerelease,
              authors: [
                {
                  name: release.author.login,
                  username: release.author.login,
                  url: release.author.html_url
                }
              ]
            };

            core.setOutput('release_data', JSON.stringify(releaseData));

      - name: Send notification to Parrot API
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.PARROT_URL }}/notify/release"
          method: "POST"
          contentType: "application/json"
          data: ${{ steps.release.outputs.release_data }}
          timeout: 5000
