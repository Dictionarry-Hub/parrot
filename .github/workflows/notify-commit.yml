name: Notify Commit

on:
  workflow_call:
    secrets:
      PARROT_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get commit information
        id: commit
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const commit = context.payload.head_commit;
            const branch = context.ref.replace('refs/heads/', '');

            if (!commit) {
              core.setFailed('No commit information found in the event payload');
              return;
            }

            // Calculate changed files with null checking
            let changedFiles = 0;
            if (commit.added && Array.isArray(commit.added)) {
              changedFiles += commit.added.length;
            }
            if (commit.modified && Array.isArray(commit.modified)) {
              changedFiles += commit.modified.length;
            }
            if (commit.removed && Array.isArray(commit.removed)) {
              changedFiles += commit.removed.length;
            }

            // Handle the message body safely
            let messageBody = null;
            if (commit.message && commit.message.includes('\n\n')) {
              messageBody = commit.message.substring(commit.message.indexOf('\n\n') + 2);
            }

            // Format the first line of the commit message
            const messageTitle = commit.message ? commit.message.split('\n')[0] : '';

            // Get commit metadata with safe fallbacks
            const commitData = {
              repository: `${owner}/${repo}`,
              branch: branch,
              commit_hash: commit.id,
              message: messageTitle,
              body: messageBody,
              url: commit.url || `https://github.com/${owner}/${repo}/commit/${commit.id}`,
              created_at: commit.timestamp || new Date().toISOString(),
              author: {
                name: commit.author ? commit.author.name : 'Unknown',
                email: commit.author && commit.author.email ? commit.author.email : null,
                username: commit.author && commit.author.username ? commit.author.username : null
              },
              changed_files: changedFiles,
              additions: null,
              deletions: null
            };

            core.setOutput('commit_data', JSON.stringify(commitData));

      - name: Send notification to Parrot API
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.PARROT_URL }}/notify/commit"
          method: "POST"
          contentType: "application/json"
          data: ${{ steps.commit.outputs.commit_data }}
          timeout: 5000
